services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buckling
      POSTGRES_PASSWORD: buckling
      POSTGRES_DB: buckling
    volumes:
      - buckling_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buckling -d buckling"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://buckling:buckling@db:5432/buckling
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  buckling_pgdata:
